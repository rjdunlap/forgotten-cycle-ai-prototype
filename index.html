<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgotten Cycle AI Prototype</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app" aria-labelledby="title">
      <section class="status-panel">
        <div>
          <p class="eyebrow">Playable slice</p>
          <h1 id="title">Forgotten Cycle</h1>
        </div>
        <div class="cycle-badge">
          <span>Cycle</span>
          <strong id="cycle">1</strong>
        </div>
      </section>

      <section class="life-panel" aria-label="Current life">
        <div class="job-row">
          <div>
            <h2>Scavenge the Tide-Line</h2>
            <p id="rate">+9 warmth about every 2.4s</p>
          </div>
          <button id="workButton" type="button">Hold Still</button>
        </div>

        <div class="meter warmth-meter" aria-label="Inner Warmth">
          <div id="progressBar" class="meter-fill"></div>
        </div>
        <div class="meter-copy">
          <span id="progressText">45 / 100</span>
          <span id="goalText">Inner Warmth</span>
        </div>
      </section>

      <section class="actions-panel" aria-label="Cycle actions">
        <button id="resetButton" type="button" disabled>Wake Again</button>
        <button id="upgradeButton" type="button" disabled>Spend Memory: Echoes of the Coast</button>
      </section>

      <section class="memory-panel" aria-label="Persistent progress">
        <div>
          <span>Memories</span>
          <strong id="memories">0</strong>
        </div>
        <div>
          <span>Echoes</span>
          <strong id="upgrades">0</strong>
        </div>
      </section>

      <ol id="log" class="log" aria-label="Activity log">
        <li>The sun is gone. Salt spray numbs your fingers.</li>
      </ol>
    </main>

    <script type="module" src="src/app.js"></script>
  </body>
</html>

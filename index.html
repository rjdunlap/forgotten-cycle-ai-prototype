<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgotten Cycle AI Prototype</title>
  </head>
  <body class="grid min-h-screen place-items-center bg-ember-bg bg-cover bg-center font-sans text-ember-text">
    <main id="app" class="grid w-[min(94vw,440px)] gap-2.5 border border-ember-accent/20 bg-ember-bg/90 p-3.5 transition-opacity duration-300 sm:p-4" aria-labelledby="title">
      <section class="flex items-center justify-between gap-4 border border-ember-line bg-ember-panel p-3.5">
        <div>
          <p class="mb-0.5 text-[0.72rem] font-extrabold uppercase text-ember-accent-strong">Playable slice</p>
          <h1 id="title" class="text-[1.65rem] font-bold leading-none">Forgotten Cycle</h1>
        </div>
        <div class="grid min-w-[72px] place-items-center border border-ember-line bg-[#121812] p-2">
          <span class="text-[0.72rem] uppercase text-ember-muted">Cycle</span>
          <strong id="cycle" class="text-[1.6rem] leading-tight text-ember-accent-strong">1</strong>
        </div>
      </section>

      <section class="border border-ember-line bg-ember-panel p-3.5" aria-label="Current life">
        <div class="grid grid-cols-[1fr_92px] items-center gap-3">
          <div>
            <h2 class="text-base font-bold">Scavenge the Tide-Line</h2>
            <p id="rate" class="text-[0.88rem] text-ember-muted">+9 warmth about every 2.4s</p>
          </div>
          <button id="workButton" type="button">Hold Still</button>
        </div>

        <div class="mt-3.5 h-[22px] overflow-hidden border border-ember-line bg-[#101510]" aria-label="Inner Warmth">
          <div id="progressBar" class="meter-fill h-full bg-gradient-to-r from-ember-red to-ember-accent-strong"></div>
        </div>
        <div class="mt-2 flex justify-between gap-3 text-[0.88rem] text-ember-muted">
          <span id="progressText">45 / 100</span>
          <span id="goalText">Inner Warmth</span>
        </div>
      </section>

      <ol id="log" class="min-h-24 max-h-[132px] space-y-1.5 overflow-auto border border-ember-line bg-ember-panel py-3 pl-7 pr-3 text-[0.86rem] text-ember-muted" aria-label="Activity log">
        <li>The sun is gone. Salt spray numbs your fingers.</li>
      </ol>
    </main>

    <dialog id="deathDialog" class="w-[min(90vw,390px)] border border-ember-accent/40 bg-ember-bg p-0 text-ember-text backdrop:bg-ember-bg/70">
      <form method="dialog" class="grid gap-4 p-5">
        <div class="grid gap-2">
          <p class="text-[0.72rem] font-extrabold uppercase text-ember-accent-strong">The First Ember</p>
          <h2 class="text-xl font-bold leading-tight">The tide claims the warmth.</h2>
          <p class="text-sm text-ember-muted">The dark is total.</p>
        </div>
        <div class="grid gap-1 border border-ember-line bg-ember-panel p-3 text-sm">
          <p id="deathStats" class="text-ember-text"></p>
          <p id="deathLesson" class="text-ember-muted"></p>
        </div>
        <button id="wakeButton" type="button">Wake Again</button>
      </form>
    </dialog>

    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
